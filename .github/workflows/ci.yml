name: CI

# [REL-1.6] the per-PR/per-push tier ONLY. The full gate (make ubsan/asan/
# lint, make mech's sabotage matrix, make test-axes) never runs here -- see
# docs/testing.md "CI" for the tier split and why.
#
# [CLOUD-SUITE] ciswitch (2026-11-11): CI runs the cloud `test` machinery, not a
# table of its own. The `test` job below CALLS .github/workflows/cloud-test.yml
# (a reusable workflow) with kind=test: its plan job reads the kind from
# tests/ci/cloud_kinds.tsv, N shards run `make test-shard` over the declared
# table tests/ci/cloud_test_shards.tsv (17 shards, ~18 min wall against the old
# 3 shards' 52-68 min), and its gather job builds the ONE verdict (green only if
# every expected shard reported rc 0). Nothing in this file names a section, a
# shard or a shard count. The runner setup (python 3.14, the PINNED libpcre2 10.46
# built from source, never a distro package -- D98) is
# .github/actions/shard-setup, shared with the shards.
#
# `make` + `make strict` stay a job of their own here: the first red a stranger's
# PR shows is a build or a new-warning failure, in ~1-2 min, before the shards finish.
#
# Runs on ubuntu-latest with GNU gcc as CC (D2: gcc is the target compiler; generated
# code uses GNU C extensions). `make strict` is the opt-in warnings-as-errors gate (R5-Q1:
# not the default, so a stranger's build never breaks on a newer gcc's opinion); CI is
# where it belongs. NOT built here, per D2: a clang job.
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run of the same PR (or the same branch on push) rather
# than let two runs race to the same conclusion. Cancelling this run cancels the
# called workflow's jobs with it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: make + make strict
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # full history: some test pins resolve ancestor commits (kept from the shard days; cheap)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/shard-setup
      - run: make
      - run: make strict

  test:
    name: test
    uses: ./.github/workflows/cloud-test.yml
    with:
      kind: test
      owner: ci

# Forks: pull_request events from a fork run this SAME workflow, unmodified. The
# repo is public, and neither this file nor cloud-test.yml uses a secret, a
# repository dispatch or a self-hosted runner (the called workflow needs only
# contents: read and the default token for artifacts), so there is nothing a fork's PR
# could leak or abuse -- the pull_request_target dance does not apply.
