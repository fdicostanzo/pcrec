name: CI

# [REL-1.6] the per-PR/per-push tier ONLY. The full gate (make ubsan/asan/
# lint, make mech's sabotage matrix, make test-axes) never runs here — see
# docs/testing.md "CI" for the tier split and why. This workflow's own
# `make test` step is also this row's first MEASUREMENT: whether the full
# `make test` suite fits inside a hosted runner at all (docs/dev/plan.md
# [REL-1.6], Frank: "curious to see if the test run fits in actions").
#
# Runs on ubuntu-latest with GNU gcc as CC (D2: gcc is the target compiler;
# CI needs no cc_resolve.sh dance the way the darwin dev box does, since
# ubuntu-latest's `gcc` already IS GNU gcc). The pinned libpcre2 10.46 (D98)
# is BUILT FROM SOURCE below, never taken from the distro package, so the
# differential tiers (PC-3/PC-4, the definitions oracle, uprops) RUN against
# the version this tree is actually measured against rather than SKIPping
# (no oracle at all) or, worse, running against the wrong one -- run 1
# (35675372280) installed `libpcre2-dev` (Ubuntu 22.04's package, 10.42,
# four minor releases behind) and measured 60 PC-3 failures that were the
# version gap restated once per row, not a real divergence. tests/registry/
# pcre2_check.c now carries a version FLOOR (D98) that SKIPs loudly on
# anything older than 10.46, so a stranger's box with an older distro
# package gets a clean skip rather than that -- but CI is exactly the box
# that should never take the skip path, which is why it pins its own copy.
#
# [CI-SHARD] (lane cishard, 2026-10-13): `make test` outgrew one hosted runner
# (run 38345462196 was killed at its 90-minute step timeout with 15 sections
# still to run; docs/dev/lanes/citime_report.md), so the job is a MATRIX of
# `make test-shard CISHARD=K/N`, each shard a serial run of its own section list.
# The split is the DECLARED TABLE tests/ci/shards.tsv, held to TEST_SECTIONS
# exactly by `test-ci-shards` (inside every shard, as a member of the list) --
# nothing in this file knows a section name. The `shard:` line below is read by
# that check too: it must list exactly 1/N..N/N for the table's N. `make test`
# stays the one-box local standard and is not what CI runs any more.
on:
  pull_request:
  push:
    branches: [main]

# Cancel a superseded run of the same PR (or the same branch on push) rather
# than let two runs race to the same conclusion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports its own verdict AND its own per-section timings:
      # the timings are the measurement the first sharded runs exist for, so a
      # red shard must not cancel the others mid-measurement.
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    # Backstop for the whole job (checkout + deps + build + strict + shard).
    # The shard step below carries its own, tighter timeout-minutes (basis
    # there); this is only a ceiling in case some earlier step itself hangs:
    # ~1 min of setup/build/strict (measured, cached libpcre2; a cache miss
    # adds the libpcre2 build, a few min) + the 55-minute shard step + upload.
    timeout-minutes: 70
    steps:
      # fetch-depth: 0 (full history), not actions/checkout@v4's shallow
      # default: run 2 (2026-09-21/22) measured tests/codegen/
      # run_cpset_structure.sh's CHECK 1R hard-failing because its pin
      # (cb546b3a, a pre-stage-1 commit `git archive`s to build the
      # failing-direction reference) does not resolve on a shallow clone.
      # It is the only git-archive/rev-parse pin `make test`'s own section
      # list (Makefile TEST_SECTIONS) reaches — the four codegen/run_*
      # _identity.sh scripts with their own REFCOMMIT/FILEPIN pins
      # (lookaround eacac76, recursion ac4917d/a70982c9, atomic e2f81d5,
      # backref 5286265) are each their own opt-in `make test-*-identity`
      # target, never in TEST_SECTIONS, so they neither ran nor were
      # exercised by the shallow clone in run 2 — nothing to say passed
      # "by luck" there, they simply did not run. `make mech`'s sabotage
      # matrix `git archive`s HEAD itself (no ancestor pin) and is not
      # part of `make test` either. The repo is small (this history costs
      # nothing worth trimming for); see the `make test` step's own timing
      # for the actual checkout-step cost next run.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pkg-config itself ships on ubuntu-latest images already; named
      # explicitly here so a future, leaner runner image doesn't silently
      # fall back to resolve_pcre2.sh's slower header-probe leg. Nothing
      # named `libpcre2` is installed via apt at all -- see below, the
      # pinned 10.46 build is the ONLY libpcre2-8 pkg-config sees.
      - name: Install build tools (pkg-config)
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      # [REL-1.6]/D98: build the PINNED libpcre2 10.46 from the official
      # release tarball rather than trusting a distro package (see the job
      # header comment for run 1's measurement of what trusting apt cost).
      # Cached by version+os so a cache hit — every run after the first —
      # pays nothing for this step; bump the cache key's `v2` suffix if the
      # pin ever moves or the configure flags change again. DEFAULT
      # CONFIGURE (shared AND static), NOT
      # `--disable-shared` — measured locally (darwin, this lane) before
      # settling on this shape: a static-only build makes `pcre2_abi_path()`
      # resolve to the TEST BINARY itself (there is no separate library file
      # for `dladdr` to name), which is exactly what `pool_from_library`'s
      # anti-circularity design (D98/[ORACLE-LINK]'s own header) depends on
      # NOT happening — it reads the resolved path's ASCII runs to build the
      # verb-name candidate pool INDEPENDENTLY of pcrec's own table, and
      # reading the test binary instead pulls in pcrec's own strings too,
      # moving the pinned probe count from 149804 to 234580 (measured, this
      # session). A default (shared+static) build resolves the real,
      # separate `.so`, matching the shape the 149804 pin was measured
      # against.
      - name: Cache libpcre2 10.46 (D98 pin)
        id: cache-pcre2-10-46
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pcre2-10.46
          key: pcre2-10.46-${{ runner.os }}-v2

      - name: Build libpcre2 10.46 from source (D98 pin)
        if: steps.cache-pcre2-10-46.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/pcre2-10.46.tar.bz2" \
            https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.46/pcre2-10.46.tar.bz2
          mkdir -p "$RUNNER_TEMP/pcre2-10.46-src"
          tar xjf "$RUNNER_TEMP/pcre2-10.46.tar.bz2" -C "$RUNNER_TEMP/pcre2-10.46-src" --strip-components=1
          cd "$RUNNER_TEMP/pcre2-10.46-src"
          ./configure --prefix="$RUNNER_TEMP/pcre2-10.46"
          make -j"$(nproc)"
          make install

      # PKG_CONFIG_PATH takes priority over pkg-config's own default search
      # path, so putting the pinned build's .pc directory there is enough
      # to make `pkg-config libpcre2-8` (tests/lib/resolve_pcre2.sh's own
      # resolution point, used identically by every PC-3/PC-4/definitions-
      # oracle/uprops consumer) resolve THIS copy — no distro libpcre2
      # package is installed at all, so there is nothing else it could
      # resolve to instead (verified below, not merely assumed).
      # LD_LIBRARY_PATH is needed too, now that the build is shared-capable
      # by default: every gcc-linked consumer of `-lpcre2-8` will prefer
      # the pinned `.so` at LINK time (pkg-config's `-L` puts it first on
      # the search path) but still needs the DYNAMIC LOADER to find it at
      # RUN time, since it is not installed anywhere on the runner's
      # default library search path.
      - name: Point PC-3's oracle at the pinned 10.46 build
        run: |
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/pcre2-10.46/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pcre2-10.46/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Verify libpcre2 resolves to the pin, not a distro package
        run: |
          set -eu
          ver="$(pkg-config --modversion libpcre2-8)"
          echo "resolved libpcre2: $ver"
          case "$ver" in
            10.46) ;;
            *) echo "expected 10.46, pkg-config resolved '$ver' instead -- PKG_CONFIG_PATH ordering or the cache is wrong" >&2; exit 1 ;;
          esac

      - name: Compiler version
        run: gcc --version

      - name: Build (make)
        run: make -j"$(nproc)"

      # Opt-in warnings-as-errors gate (R5-Q1: NOT the default `make`/`make
      # test`, so a stranger's build never breaks on a newer gcc's new
      # opinion) -- CI is exactly the place to run it anyway, on a pinned
      # runner image, so a real new warning is caught before merge instead
      # of waiting for someone to run `make strict` by hand. Writes nothing;
      # safe to run before `make test` touches the same build/ tree.
      #
      # Once per run, not once per shard: it compiles the same tree whatever
      # the shard, so shard 1 carries it (BEFORE its test sections, so a new
      # warning fails that job fast; the other shards are unaffected, which
      # fail-fast: false above makes visible rather than hiding).
      - name: make strict
        if: startsWith(matrix.shard, '1/')
        run: make strict

      # THE SHARD: `make test-shard CISHARD=K/N` runs exactly shard K's sections
      # from tests/ci/shards.tsv with `make test`'s own accounting (same -k
      # launch, same marker files, same "sections ran: N/M" trailer over THIS
      # shard's list; verdict = make's `*** [...test-X] Error` lines).
      #
      # PER-SECTION TIMESTAMPS: `make --debug=j` prints a `Putting child ...
      # (test-X)` line when a section's recipe starts and `Removing child`
      # when it ends; scripts/sectiontimes (the mechanism scripts/perfrun
      # already uses for its sections.tsv, [TT-JTUNE]) stamps each such line
      # with its arrival time into build/ci/sections.raw (epoch seconds,
      # flushed per line, so a step the timeout kills leaves every started
      # section on disk) and passes every OTHER line through unchanged to the
      # log. Nothing in the Makefile or the tests carries the instrumentation.
      #
      # timeout-minutes BASIS (cishard2, 2026-10-13, from run 38354147463): the
      # table now holds runner-measured seconds and projects 37.1 min for the
      # longest shard (the run's own shards took 25.7 / 37.6 / 37.1 min, the
      # first short only because its SIMD family died at once on taskset).
      # Stated spread factor 1.4 (the serial suite's same-tree runner spread
      # was 1.5x, 56..85 min; one sharded run is too little data to go
      # lower): 37.1 x 1.4 = 52, rounded up to 55. NOT headroom for growth.
      - name: make test-shard
        timeout-minutes: 55
        run: |
          set -o pipefail
          mkdir -p build/ci
          { time make --debug=j test-shard CISHARD="${{ matrix.shard }}"; } 2>&1 \
            | python3 scripts/sectiontimes stamp build/ci/sections.raw \
            | tee build/ci/test.log

      # Runs on success AND failure AND a step-timeout kill. `--open` adds the
      # sections that STARTED and never finished (end = last stamp, marked
      # `open`), which is exactly the row a killed run needs. sections.raw
      # carries the absolute epoch stamp of every start/end.
      - name: Per-section timings
        if: always()
        run: |
          mkdir -p build/ci
          if [ -s build/ci/sections.raw ]; then
            python3 scripts/sectiontimes report build/ci/sections.raw --open | tee build/ci/sections.tsv
          else
            echo "no sections.raw: the shard step never started" | tee build/ci/sections.tsv
          fi

      - name: Upload per-section timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcrec-ci-sections-${{ strategy.job-index }}
          path: |
            build/ci/sections.tsv
            build/ci/sections.raw
          if-no-files-found: warn
          retention-days: 30

      # build/watchdog.log accumulates one line per scripts/watchdog-wrapped
      # call across the shard (compiler invocations under a CPU/RSS/wall
      # budget) -- the single most useful artifact for a hung or budget-killed
      # case. build/ci/test.log is this job's own captured stdout+stderr of
      # the shard step. Both are gitignored (build/) so they only exist on the
      # runner; upload them on failure only -- a green run has nothing here
      # worth keeping.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pcrec-test-logs-${{ strategy.job-index }}
          path: |
            build/ci/test.log
            build/watchdog.log
          if-no-files-found: warn
          retention-days: 14

# NOT built here, per D2 (gcc is the target compiler; generated code uses
# GNU C extensions) and Frank's charter for this row: a second `strict-clang`
# job. clang is not what pcrec targets, `make strict` and `make test` both
# resolve CC to gcc unconditionally on this image, and a clang-only warning
# would be a false alarm this workflow has no business raising. See
# docs/testing.md "CI" for the one-line version of this.
#
# Forks: pull_request events from a fork run this SAME job, unmodified. The
# repo is public, this workflow uses no secrets, no repository dispatch and
# no self-hosted runner, so there is nothing here a fork's PR could leak or
# abuse by running it -- the usual pull_request_target dance (needed when a
# workflow touches secrets or writes back to the base repo) does not apply.
